<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Conductores</title>
    <style>
        :root { --primary: #0284c7; --bg-base: #0f172a; --bg-card: #1e293b; --text-muted: #94a3b8; --border: #334155; }
        body { font-family: sans-serif; background: var(--bg-base); margin: 0; display: flex; justify-content: center; padding-top: 40px; color: white;}
        .card { background: var(--bg-card); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid var(--border); box-sizing: border-box;}
        h3 { color: white; margin-top: 0; }
        .form-group { margin-bottom: 16px; position: relative;}
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.85rem; color: var(--text-muted); font-weight: bold;}
        .form-group input { width: 100%; padding: 13px; border-radius: 8px; border: 1px solid var(--border); background: #020617; color: white; box-sizing: border-box;}
        .password-wrapper { position: relative; display: flex; align-items: center; }
        .password-wrapper input { padding-right: 75px; }
        .btn-ver-pass { position: absolute; right: 10px; background: transparent; border: none; color: var(--primary); font-size: 0.75rem; font-weight: bold; cursor: pointer; text-transform: uppercase; padding: 5px 8px; }
        .btn-ver-pass:hover { color: white; }
        .btn-opcion { background: var(--primary); border: none; color: white; padding: 16px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;}
        .btn-secundario { background: transparent; color: var(--text-muted); border: none; width: 100%; cursor: pointer; padding: 10px; margin-top: 10px; text-decoration: underline;}
        #toast { position: fixed; bottom: 20px; background: #ef4444; color: white; padding: 10px 20px; border-radius: 8px; display: none; }
    </style>
</head>
<body>
    <div id="toast">Error</div>
    
    <div class="card" id="caja-login">
        <h3>Acceso a Conductores</h3>
        <div class="form-group"><label>Correo</label><input type="email" id="log-email"></div>
        <div class="form-group">
            <label>Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="log-pass">
                <button type="button" class="btn-ver-pass" onclick="togglePassword('log-pass', this)">Ver</button>
            </div>
        </div>
        <button class="btn-opcion" onclick="loginChofer()">Ingresar al Panel</button>
        <button class="btn-secundario" onclick="document.getElementById('caja-login').style.display='none'; document.getElementById('caja-registro').style.display='block';">No tengo cuenta. Registrarme</button>
        <button class="btn-secundario" onclick="window.location.href='index.html'">Volver al Inicio</button>
    </div>

    <div class="card" id="caja-registro" style="display:none;">
        <h3>Registro de Conductor</h3>
        <div class="form-group"><label>Nombre Completo</label><input type="text" id="reg-nombre"></div>
        <div class="form-group"><label>Vehículo</label><input type="text" id="reg-vehiculo"></div>
        <div class="form-group"><label>WhatsApp</label><input type="tel" id="reg-telefono"></div>
        <div class="form-group"><label>Correo</label><input type="email" id="reg-email"></div>
        <div class="form-group">
            <label>Contraseña</label>
            <div class="password-wrapper">
                <input type="password" id="reg-pass">
                <button type="button" class="btn-ver-pass" onclick="togglePassword('reg-pass', this)">Ver</button>
            </div>
        </div>
        <button class="btn-opcion" onclick="registrarChofer()">Crear Cuenta</button>
        <button class="btn-secundario" onclick="document.getElementById('caja-registro').style.display='none'; document.getElementById('caja-login').style.display='block';">Ya tengo cuenta. Ingresar</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s",
            authDomain: "gestorinmobiliario-d68b3.firebaseapp.com",
            projectId: "gestorinmobiliario-d68b3",
            databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database();

        function mostrarError(msg) { document.getElementById('toast').innerText = msg; document.getElementById('toast').style.display = 'block'; setTimeout(() => document.getElementById('toast').style.display = 'none', 4000); }

        function togglePassword(idInput, btn) {
            let input = document.getElementById(idInput);
            if(input.type === "password") { input.type = "text"; btn.innerText = "Ocultar"; }
            else { input.type = "password"; btn.innerText = "Ver"; }
        }

        function loginChofer() {
            let email = document.getElementById('log-email').value; let pass = document.getElementById('log-pass').value;
            if(!email || !pass) return mostrarError("Ingrese datos");
            auth.signInWithEmailAndPassword(email, pass).then(() => {
                window.location.href = 'panel_chofer.html';
            }).catch(e => mostrarError("Error: Credenciales incorrectas. Verifique su contraseña."));
        }

        function registrarChofer() {
            let nombre = document.getElementById('reg-nombre').value; let vehiculo = document.getElementById('reg-vehiculo').value;
            let tel = document.getElementById('reg-telefono').value; let email = document.getElementById('reg-email').value; let pass = document.getElementById('reg-pass').value;
            if(!nombre || !email || !pass) return mostrarError("Faltan datos");
            if(pass.length < 6) return mostrarError("La contraseña debe tener 6 caracteres");
            
            auth.createUserWithEmailAndPassword(email, pass).then((userCred) => {
                db.ref(`choferes_turismo/${userCred.user.uid}`).set({ nombre: nombre, vehiculo: vehiculo, telefono: tel, email: email }).then(() => {
                    window.location.href = 'panel_chofer.html';
                });
            }).catch(e => mostrarError("Error: " + e.message));
        }
    </script>
</body>
</html>

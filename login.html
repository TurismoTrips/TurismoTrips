<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurismoTrips | Acceso Conductor</title>
    <style>
        :root { --primary: #0284c7; --bg-base: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-base); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box;}
        .card { background: var(--bg-card); padding: 25px; border-radius: 12px; border: 1px solid var(--border); width: 100%; max-width: 420px; box-sizing: border-box; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.85rem; color: var(--text-muted); }
        .form-group input, .form-group select { width: 100%; padding: 11px; border-radius: 8px; border: 1px solid var(--border); background: #020617; color: white; box-sizing: border-box; outline:none;}
        .btn-primary { background: var(--primary); color: white; border: none; padding: 13px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px;}
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; text-align: center; background: transparent; border: 1px solid var(--border); color: var(--text-muted); border-radius: 8px; cursor: pointer; }
        .tab.active { background: var(--primary); color: white; border-color: var(--primary); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    </style>
</head>
<body>
    <div class="card">
        <h2 style="margin-top:0; text-align:center;">Acceso Choferes</h2>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('login')" id="tab-login">Ingresar</div>
            <div class="tab" onclick="switchTab('register')" id="tab-register">Registrarse</div>
        </div>

        <div id="form-login">
            <div class="form-group"><label>Correo Electrónico</label><input type="email" id="log-email"></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="log-pass"></div>
            <button class="btn-primary" onclick="login()">Entrar al Panel</button>
        </div>

        <div id="form-register" style="display:none;">
            <div class="form-group"><label>Nombre Completo</label><input type="text" id="reg-nombre"></div>
            <div class="form-group"><label>Teléfono (WhatsApp)</label><input type="tel" id="reg-tel"></div>
            
            <div class="form-group"><label>Modelo del Vehículo</label><input type="text" id="reg-vehiculo" placeholder="Ej: Toyota Vitz 2012"></div>
            
            <div class="grid-2">
                <div class="form-group"><label>Color del Auto</label><input type="text" id="reg-color" placeholder="Ej: Plata / Rojo"></div>
                <div class="form-group"><label>N° de Chapa</label><input type="text" id="reg-chapa" placeholder="Ej: AA123BB"></div>
            </div>

            <div class="form-group"><label>Enlace Foto del Auto (Para publicidad)</label><input type="url" id="reg-foto" placeholder="https://ejemplo.com/foto.jpg"></div>
            
            <div class="form-group"><label>Ciudad Base</label>
                <select id="reg-ciudad">
                    <option value="Asunción (Central)">Asunción (Central)</option>
                    <option value="Itauguá (Central)">Itauguá (Central)</option>
                    <option value="Capiatá (Central)">Capiatá (Central)</option>
                    <option value="San Lorenzo (Central)">San Lorenzo (Central)</option>
                    <option value="Luque (Central)">Luque (Central)</option>
                    <option value="Paraguarí (Paraguarí)">Paraguarí (Paraguarí)</option>
                    <option value="Ciudad del Este (Alto Paraná)">Ciudad del Este (Alto Paraná)</option>
                </select>
            </div>
            
            <div class="form-group"><label>Correo Electrónico</label><input type="email" id="reg-email"></div>
            <div class="form-group"><label>Contraseña (Mínimo 6 letras)</label><input type="password" id="reg-pass"></div>
            <button class="btn-primary" onclick="registrar()">Crear Cuenta Conductor</button>
        </div>
    </div>

    <!-- FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s",
            authDomain: "gestorinmobiliario-d68b3.firebaseapp.com",
            projectId: "gestorinmobiliario-d68b3",
            databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com"
        };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth(); const db = firebase.database();

        function switchTab(tab) {
            document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
            document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
            document.getElementById('tab-login').className = tab === 'login' ? 'tab active' : 'tab';
            document.getElementById('tab-register').className = tab === 'register' ? 'tab active' : 'tab';
        }

        function login() {
            auth.signInWithEmailAndPassword(document.getElementById('log-email').value, document.getElementById('log-pass').value)
                .then(() => window.location.href = 'panel_chofer.html')
                .catch(e => alert("Error al ingresar: " + e.message));
        }

        function registrar() {
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-pass').value;
            const data = {
                nombre: document.getElementById('reg-nombre').value,
                telefono: document.getElementById('reg-tel').value,
                vehiculo: document.getElementById('reg-vehiculo').value,
                color: document.getElementById('reg-color').value || "No especificado",
                chapa: document.getElementById('reg-chapa').value || "En trámite",
                fotoVehiculo: document.getElementById('reg-foto').value || "",
                ciudadBase: document.getElementById('reg-ciudad').value
            };

            if(!data.nombre || !data.telefono || !data.vehiculo) {
                return alert("Por favor complete nombre, teléfono y vehículo.");
            }

            auth.createUserWithEmailAndPassword(email, pass).then(userCred => {
                db.ref(`choferes_turismo/${userCred.user.uid}`).set(data).then(() => {
                    window.location.href = 'panel_chofer.html';
                });
            }).catch(e => alert("Error en registro: " + e.message));
        }
    </script>
</body>
</html>

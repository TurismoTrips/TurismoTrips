<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurismoTrips | Panel de Conductor en Vivo</title>
    <style>
        :root { --primary: #0284c7; --bg-base: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-base); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;}
        
        .container { width: 100%; max-width: 600px; }
        .card { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.3); }
        
        .header-modulo { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;}
        .header-modulo h3 { margin: 0; font-size: 1.2rem; color: white; }
        .btn-volver { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; text-decoration: underline; }
        .btn-volver:hover { color: white; }

        .viaje-card { background: #020617; border: 1px solid var(--border); padding: 18px; border-radius: 10px; margin-bottom: 20px; transition: 0.3s;}
        .viaje-card.asignado { border: 2px solid var(--success); background: rgba(16, 185, 129, 0.05); }
        
        .viaje-card h4 { margin: 0 0 10px 0; color: white; font-size: 1.1rem; }
        .viaje-card p { margin: 6px 0; font-size: 0.85rem; color: var(--text-muted); }
        .badge-estado { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: rgba(16,185,129,0.2); color: var(--success); }
        .badge-clima { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        
        .btn-opcion { background: var(--primary); border: none; color: white; padding: 10px 15px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-opcion:hover { filter: brightness(1.1); }
        .btn-secundario { background: transparent; color: var(--primary); border: 1px solid var(--primary); font-weight: 600; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-secundario:hover { background: rgba(2, 132, 199, 0.1); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        .btn-compartir { background: #10b981; border: none; color: white; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }
        .btn-reset { background: var(--warning); border: none; color: #020617; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; font-weight: bold; cursor: pointer; }

        #toast-notification {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1e293b; color: white; border: 1px solid var(--primary); padding: 14px 24px;
            border-radius: 30px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0; transition: all 0.3s ease-in-out; z-index: 999; pointer-events: none; text-align: center; max-width: 90%;
        }
        #toast-notification.activo { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="toast-notification">Mensaje del sistema</div>

    <div class="container">
        <div class="card">
            <div class="header-modulo">
                <h3 id="panel-nombre-chofer">Centro de Control</h3>
                <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
                    <button class="btn-reset" onclick="restaurarDescartados()">🔄 Ver Todos</button>
                    <button class="btn-compartir" onclick="compartirApp()">📲 Compartir</button>
                    <button class="btn-volver" onclick="cerrarSesion()">Salir</button>
                </div>
            </div>
            
            <p style="text-align:left; color:white; font-weight:bold; margin-bottom: 5px;">Bolsa de Viajes en Tiempo Real:</p>
            <p id="info-gps-chofer" style="font-size:0.8rem; color:var(--success); margin-bottom: 15px;">🛰️ Activando GPS en vivo...</p>

            <div id="contenedor-viajes-chofer">
                <p style="color:var(--text-muted); font-size:0.9rem;">Cargando solicitudes...</p>
            </div>
        </div>
    </div>

    <!-- FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s",
            authDomain: "gestorinmobiliario-d68b3.firebaseapp.com",
            projectId: "gestorinmobiliario-d68b3",
            databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database(); const auth = firebase.auth();

        let choferPerfilData = null;
        let choferLatActual = null; let choferLonActual = null;
        const mesesNombre = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const linkPlataforma = "https://turismotrips.github.io/TurismoTrips/";

        window.mostrarNotificacion = function(mensaje) {
            let toast = document.getElementById('toast-notification');
            toast.innerText = mensaje; toast.classList.add('activo');
            setTimeout(() => { toast.classList.remove('activo'); }, 4000);
        }

        window.compartirApp = function() {
            if (navigator.share) {
                navigator.share({
                    title: 'TurismoTrips Paraguay',
                    text: '¡Descubrí TurismoTrips! La nueva plataforma para viajes de larga distancia e interurbanos. Pedí tu viaje acá 👇',
                    url: linkPlataforma
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(linkPlataforma);
                mostrarNotificacion("Enlace copiado. ¡Pegalo en WhatsApp!");
            }
        }

        function iniciarRastreoChofer(uid) {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(position => {
                    choferLatActual = position.coords.latitude; choferLonActual = position.coords.longitude;
                    db.ref(`choferes_turismo/${uid}/ubicacionEnVivo`).set({ lat: choferLatActual, lon: choferLonActual, ultimaActualizacion: new Date().toLocaleTimeString() });
                    document.getElementById('info-gps-chofer').innerText = `🛰️ GPS Activo (Tu base de partida en vivo)`;
                }, error => { document.getElementById('info-gps-chofer').innerText = "⚠️ GPS inactivo (Permiso denegado)"; }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
            }
        }

        function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
            let R = 6371; let dLat = (lat2 - lat1) * Math.PI / 180; let dLon = (lon2 - lon1) * Math.PI / 180;
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
            return (R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)))).toFixed(1);
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref(`choferes_turismo/${user.uid}`).once('value').then(snap => {
                    choferPerfilData = snap.exists() ? snap.val() : { nombre: "Conductor", vehiculo: "Vehículo", telefono: "0981" };
                    document.getElementById('panel-nombre-chofer').innerText = "Panel: " + (choferPerfilData.nombre || "Chofer");
                    iniciarRastreoChofer(user.uid); cargarViajesPendientesChofer(user.uid);
                });
            } else { window.location.href = 'login.html'; }
        });

        window.cerrarSesion = function() { auth.signOut().then(() => { window.location.href = 'login.html'; }); }

        window.restaurarDescartados = function() {
            if(!auth.currentUser) return;
            db.ref('viajes_turismo/pendientes').once('value').then(snapshot => {
                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        db.ref(`viajes_turismo/pendientes/${child.key}/descartados/${auth.currentUser.uid}`).remove();
                    });
                    mostrarNotificacion("🔄 Todos los viajes ocultos han vuelto a aparecer.");
                }
            });
        }

        function formatearFechaBonita(fechaStr) {
            if(!fechaStr) return "Fecha no especificada";
            let partes = fechaStr.split('-');
            if(partes.length !== 3) return fechaStr;
            let fechaObj = new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
            if(isNaN(fechaObj.getTime())) return fechaStr;
            let dias = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
            return `${dias[fechaObj.getDay()]}, ${parseInt(partes[2])} de ${mesesNombre[parseInt(partes[1]) - 1]} de ${partes[0]}`;
        }

        window.enviarOfertaPrecio = function(viajeId) {
            let precioInp = document.getElementById(`precio-${viajeId}`).value.trim();
            if(!precioInp || isNaN(precioInp)) return mostrarNotificacion("Ingrese una tarifa válida.");
            db.ref(`viajes_turismo/pendientes/${viajeId}/ofertas/${auth.currentUser.uid}`).set({
                choferNombre: choferPerfilData.nombre || "Chofer", 
                choferVehiculo: choferPerfilData.vehiculo || "Vehículo",
                choferTelefono: choferPerfilData.telefono || "", 
                precio: parseInt(precioInp).toLocaleString('es-PY') + " Gs."
            }).then(() => mostrarNotificacion("¡Tarifa guardada correctamente!"));
        }

        window.descartarViaje = function(viajeId) {
            if(confirm("¿Seguro que deseas ocultar este viaje de tu lista?")) {
                db.ref(`viajes_turismo/pendientes/${viajeId}/descartados/${auth.currentUser.uid}`).set(true);
            }
        }

        window.confirmarAcuerdo = function(viajeId) {
            if(confirm("¿Cerraste el trato con el pasajero? El viaje se te asignará.")) {
                db.ref(`viajes_turismo/pendientes/${viajeId}`).update({
                    estado: 'Acuerdo Cerrado',
                    choferAsignadoUid: auth.currentUser.uid
                });
                mostrarNotificacion("¡Felicidades! Viaje asegurado y asignado a ti.");
            }
        }

        window.finalizarViaje = function(viajeId) {
            if(confirm("¿Completaste el viaje con éxito? Esto lo eliminará del sistema.")) {
                db.ref(`viajes_turismo/pendientes/${viajeId}`).remove();
                mostrarNotificacion("Viaje finalizado y archivado.");
            }
        }

        function cargarViajesPendientesChofer(choferUid) {
            db.ref('viajes_turismo/pendientes').on('value', (snapshot) => {
                let html = '';
                if(snapshot.exists()){
                    let listaViajes = [];
                    snapshot.forEach(child => listaViajes.push({ id: child.key, ...child.val() }));
                    listaViajes.reverse();

                    listaViajes.forEach(v => {
                        try {
                            if (v.descartados && v.descartados[choferUid]) return;
                            if (v.choferAsignadoUid && v.choferAsignadoUid !== choferUid) return;

                            let esMio = (v.choferAsignadoUid === choferUid);
                            let claseCard = esMio ? 'viaje-card asignado' : 'viaje-card';
                            
                            let distanciaTexto = "Calculando distancia...";
                            let ciudadChofer = (choferPerfilData.ciudadBase || "Paraguay").split(' (')[0];
                            let origenLimpio = (v.origen || "Paraguay").split(' (')[0];
                            let destinoLimpio = (v.destino || "Paraguay").split(' (')[0];

                            let puntoA = (choferLatActual && choferLonActual) ? `${choferLatActual},${choferLonActual}` : `${ciudadChofer}, Paraguay`;
                            let puntoB = (v.lat && v.lon) ? `${v.lat},${v.lon}` : `${origenLimpio}, Paraguay`;
                            let puntoC = `${destinoLimpio}, Paraguay`;

                            if (choferLatActual && v.lat) {
                                distanciaTexto = `📍 Aprox. <strong>${calcularDistanciaKm(choferLatActual, choferLonActual, v.lat, v.lon)} km</strong> de distancia al pasajero`;
                            } else {
                                distanciaTexto = `📍 Esperando ubicación GPS del pasajero...`;
                            }

                            let linkGmaps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(puntoA)}&destination=${encodeURIComponent(puntoC)}&waypoints=${encodeURIComponent(puntoB)}`;
                            
                            let miOferta = (v.ofertas && v.ofertas[choferUid]) ? v.ofertas[choferUid] : null;
                            let fechaLegible = formatearFechaBonita(v.fecha);

                            let vCliente = v.cliente || 'Pasajero';
                            let vDestino = v.destino || 'Destino';
                            let vVehiculo = choferPerfilData.vehiculo || 'Vehículo';
                            let vNombreChofer = choferPerfilData.nombre || 'Chofer';
                            let vTelefonoStr = (v.telefono || '').replace(/^0+/, '');

                            let textoWpp = miOferta 
                                ? `Hola ${vCliente}, vi tu solicitud en *TurismoTrips* para viajar el ${fechaLegible} a ${vDestino}. Mi propuesta es de *${miOferta.precio}* con vehículo ${vVehiculo} (${vNombreChofer}). ¿Coordinamos? \n\n📍 Guardá nuestra plataforma para futuros viajes: ${linkPlataforma}`
                                : `Hola ${vCliente}, vi tu solicitud en *TurismoTrips* para viajar el ${fechaLegible} a ${vDestino}. Con vehículo ${vVehiculo} (${vNombreChofer}). ¿Conversamos sobre el traslado? \n\n📍 Guardá nuestra plataforma para futuros viajes: ${linkPlataforma}`;
                            
                            let linkWppDirecto = `https://wa.me/595${vTelefonoStr}?text=${encodeURIComponent(textoWpp)}`;
                            let alertaClima = (v.clima && (v.clima.includes("Tormenta") || v.clima.includes("ALERTA"))) ? `background: rgba(239, 68, 68, 0.2); color: var(--danger);` : ``;

                            let botonesAcciones = "";

                            if (esMio) {
                                botonesAcciones = `
                                    <div class="grid-2" style="margin-top:12px;">
                                        <button class="btn-secundario" onclick="window.open('${linkGmaps}', '_blank')">Navegar GPS</button>
                                        <button class="btn-opcion" style="background:#16a34a;" onclick="window.open('${linkWppDirecto}', '_blank')">WhatsApp Pasajero</button>
                                    </div>
                                    <button class="btn-opcion" style="background:var(--primary); margin-top:10px; width:100%;" onclick="finalizarViaje('${v.id}')">🏁 Marcar Viaje como Finalizado</button>
                                `;
                            } else {
                                botonesAcciones = `
                                    <div style="background:#020617; border:1px dashed var(--border); padding:12px; border-radius:8px; margin-top:12px;">
                                        <label style="font-size:0.8rem; color:var(--text-muted); font-weight:bold; display:block; margin-bottom:6px;">TU PROPUESTA DE TARIFA (Gs.):</label>
                                        <div style="display:flex; gap:10px;">
                                            <input type="number" id="precio-${v.id}" placeholder="Ej: 250000" value="${miOferta ? miOferta.precio.replace(/[^0-9]/g, '') : ''}" style="padding:10px; width:100%; border-radius:8px; border:1px solid var(--border); background:#0f172a; color:white; outline:none;">
                                            <button class="btn-opcion" style="white-space:nowrap;" onclick="enviarOfertaPrecio('${v.id}')">Actualizar</button>
                                        </div>
                                    </div>
                                    <div class="grid-2" style="margin-top:12px;">
                                        <button class="btn-secundario" onclick="window.open('${linkGmaps}', '_blank')">Ruta: A ➔ B ➔ C</button>
                                        <button class="btn-opcion" style="background:#16a34a;" onclick="window.open('${linkWppDirecto}', '_blank')">WhatsApp Pasajero</button>
                                    </div>
                                    <div class="grid-2" style="margin-top:10px;">
                                        <button class="btn-secundario" style="color:var(--danger); border-color:var(--danger);" onclick="descartarViaje('${v.id}')">🚫 Descartar</button>
                                        <button class="btn-opcion" style="background:var(--primary);" onclick="confirmarAcuerdo('${v.id}')">🤝 Confirmar Acuerdo</button>
                                    </div>
                                `;
                            }

                            html += `
                            <div class="${claseCard}">
                                <h4>Ruta: ${v.origen || 'N/A'} ➔ ${vDestino}</h4>
                                <p>📅 Fecha: <strong>${fechaLegible}</strong> | 👥 Pasajeros: <strong>${v.pasajeros || 1}</strong></p>
                                <p>👤 Pasajero: <strong>${vCliente}</strong> 
                                   ${esMio ? `<span class="badge-estado" style="background:var(--success); color:white;">Acordado Contigo</span>` : `<span class="badge-estado">${v.estado || 'Pendiente'}</span>`}
                                </p>
                                <p style="color:var(--primary); font-size:0.85rem; margin-top:4px;">${distanciaTexto}</p>
                                <p style="margin-top:6px;"><span class="badge-clima" style="${alertaClima}">Clima: ${v.clima || 'Normal'}</span></p>
                                
                                ${botonesAcciones}
                            </div>`;
                        } catch (error) {
                            console.log("Error al renderizar viaje");
                        }
                    });
                } else { html = "<p style='color:white;'>No hay solicitudes activas en tu zona.</p>"; }
                document.getElementById('contenedor-viajes-chofer').innerHTML = html;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurismoTrips | Panel Conductor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #0ea5e9; --bg-base: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981; --danger: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg-base); color: var(--text-main); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        .container { width: 100%; max-width: 600px; }
        
        .header-panel { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .header-acciones { display: flex; gap: 8px; width: 100%; margin-top: 15px; flex-wrap: wrap; }
        
        .viaje-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .viaje-card.asignado { border-left: 5px solid var(--success); }
        
        .btn { padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; text-align: center; border: none; flex: 1; transition: 0.2s;}
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .btn-primary:active { transform: scale(0.98); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .caja-tarifa { background: var(--bg-base); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-top: 15px; }
        .caja-tarifa input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: white; margin-bottom: 10px; box-sizing:border-box; outline:none;}

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; overflow-y:auto; padding: 20px; box-sizing:border-box;}
        .modal-overlay.activo { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-card); padding: 20px; border-radius: 15px; width: 100%; max-width: 400px; box-sizing: border-box; position: relative;}
        
        .form-group { margin-bottom: 12px; text-align: left; }
        .form-group label { display: block; margin-bottom: 4px; font-size: 0.8rem; color: var(--text-muted); font-weight: bold; }
        .form-group input[type="text"], .form-group input[type="tel"], .form-group select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: #020617; color: white; box-sizing: border-box; outline:none; }
        
        .file-upload-wrapper { position: relative; width: 100%; height: 45px; border: 1px dashed var(--primary); border-radius: 8px; background: rgba(14, 165, 233, 0.1); display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; }
        .file-upload-wrapper input[type="file"] { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
        .file-upload-text { color: var(--primary); font-weight: bold; font-size: 0.85rem; pointer-events: none;}

        .flayer-container { width: 100%; max-width: 350px; margin: 0 auto; border-radius: 16px; overflow: hidden; background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); box-shadow: 0 15px 35px rgba(0,0,0,0.5); position: relative; border: 1px solid #334155; }
        .flayer-header { background: var(--primary); color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }
        
        .flayer-imagen-coche { width: 100%; height: 200px; background-color: #000; position: relative; overflow: hidden; }
        .flayer-imagen-coche img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; }
        .flayer-imagen-coche .gradiente { position: absolute; bottom: 0; left: 0; width: 100%; height: 80px; background: linear-gradient(to top, #0f172a, transparent); }
        
        .flayer-datos { padding: 0 20px; text-align: center; position: relative; top: -20px; }
        .flayer-nombre { font-size: 1.4rem; color: white; font-weight: bold; margin: 0 0 5px 0; text-shadow: 0 2px 4px rgba(0,0,0,0.8);}
        .flayer-vehiculo { color: var(--primary); font-size: 1rem; font-weight: bold; margin-bottom: 15px; }
        
        .flayer-qr-box { background: white; padding: 10px; border-radius: 12px; width: 140px; margin: 0 auto; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .flayer-qr-box img { width: 100%; height: auto; display: block; }
        
        .flayer-footer { text-align: center; padding: 20px; }
        .flayer-cta { display: inline-block; background: var(--success); color: white; padding: 8px 16px; border-radius: 20px; font-weight: bold; font-size: 0.85rem; letter-spacing: 0.5px; margin-bottom: 8px;}
        .flayer-zona { color: var(--text-muted); font-size: 0.75rem; font-weight: 600; text-transform: uppercase;}

        #toast-notification { position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px); background: #334155; color: white; border: 1px solid #475569; padding: 14px 24px; border-radius: 30px; font-weight: 600; font-size: 0.95rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 0; transition: all 0.3s ease-in-out; z-index: 2000; text-align: center; width: 90%; max-width: 400px; pointer-events: none;}
        #toast-notification.activo { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="toast-notification">Mensaje del sistema</div>

    <!-- MODAL EDITAR PERFIL -->
    <div id="modal-perfil" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color:white; margin: 0 0 15px 0; border-bottom:1px solid var(--border); padding-bottom:10px;">⚙️ Mi Perfil Conductor</h3>
            
            <div class="form-group"><label>Nombre Completo</label><input type="text" id="edit-nombre"></div>
            <div class="form-group"><label>WhatsApp de Contacto</label><input type="tel" id="edit-tel"></div>
            <div class="form-group"><label>Modelo y Año del Vehículo</label><input type="text" id="edit-vehiculo" placeholder="Ej: Toyota Vitz 2012"></div>
            
            <div class="grid-2">
                <div class="form-group"><label>Color del Auto</label><input type="text" id="edit-color" placeholder="Ej: Plata / Rojo"></div>
                <div class="form-group"><label>Número de Chapa</label><input type="text" id="edit-chapa" placeholder="Ej: AA123BB"></div>
            </div>

            <div class="form-group">
                <label>Actualizar Foto (Fundamental para tu publicidad)</label>
                <div class="file-upload-wrapper">
                    <span class="file-upload-text" id="edit-foto-texto">📸 Tocar para elegir de la Galería</span>
                    <input type="file" id="edit-foto-archivo" accept="image/*" onchange="mostrarNombreArchivoEdit('edit-foto-archivo', 'edit-foto-texto')">
                </div>
            </div>
            
            <div class="form-group"><label>Ciudad Base</label>
                <select id="edit-ciudad">
                    <option value="Asunción (Central)">Asunción (Central)</option>
                    <option value="Itauguá (Central)">Itauguá (Central)</option>
                    <option value="Capiatá (Central)">Capiatá (Central)</option>
                    <option value="San Lorenzo (Central)">San Lorenzo (Central)</option>
                    <option value="Luque (Central)">Luque (Central)</option>
                    <option value="Paraguarí (Paraguarí)">Paraguarí (Paraguarí)</option>
                    <option value="Ciudad del Este (Alto Paraná)">Ciudad del Este (Alto Paraná)</option>
                </select>
            </div>

            <div class="grid-2" style="margin-top: 20px;">
                <button class="btn btn-success" id="btn-guardar-perfil" onclick="guardarPerfil()">Guardar</button>
                <button class="btn btn-outline" onclick="cerrarModalPerfil()">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- MODAL FLYER PUBLICITARIO -->
    <div id="modal-qr" class="modal-overlay">
        <div class="modal-content" style="background:transparent; border:none; box-shadow:none; padding:0;">
            
            <div id="flyer-exportable" class="flayer-container">
                <div class="flayer-header">TurismoTrips Oficial</div>
                
                <div class="flayer-imagen-coche">
                    <img id="promo-foto-img" src="" alt="Coche" crossorigin="anonymous">
                    <div class="gradiente"></div>
                </div>
                
                <div class="flayer-datos">
                    <h2 class="flayer-nombre" id="promo-nombre">Conductor</h2>
                    <div class="flayer-vehiculo" id="promo-auto">Vehículo y Color</div>
                    
                    <div class="flayer-qr-box">
                        <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://turismotrips.github.io/TurismoTrips/&margin=1" alt="QR" crossorigin="anonymous">
                    </div>
                </div>
                
                <div class="flayer-footer">
                    <div class="flayer-cta">📲 ESCANEA PARA PEDIR TU VIAJE</div>
                    <div class="flayer-zona" id="promo-zona">Base: Paraguay</div>
                </div>
            </div>

            <div style="margin-top:20px; display:flex; flex-direction:column; gap:10px; padding: 0 10px;">
                <button class="btn btn-primary" id="btn-descargar-flyer" onclick="descargarFlyer()">📥 Descargar Imagen para Redes</button>
                <button class="btn btn-outline" style="background:var(--bg-card);" onclick="cerrarModalQR()">Cerrar Publicidad</button>
            </div>
            
        </div>
    </div>

    <div class="container">
        <div class="header-panel">
            <h2 id="panel-nombre-chofer" style="margin:0; font-size:1.4rem;">Mi Panel</h2>
            <div class="header-acciones">
                <button class="btn btn-outline" onclick="abrirModalPerfil()">⚙️ Perfil</button>
                <button class="btn btn-primary" style="background:var(--success); border:none;" onclick="abrirModalQR()">📢 Mi Publicidad</button>
                <button class="btn btn-outline" onclick="restaurarDescartados()">🔄 Recargar</button>
                <button class="btn btn-outline" style="color:#f87171;" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
        <div id="contenedor-viajes-chofer"><p style="text-align:center;">Cargando solicitudes...</p></div>
    </div>

    <!-- FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-storage-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s", authDomain: "gestorinmobiliario-d68b3.firebaseapp.com", projectId: "gestorinmobiliario-d68b3", databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com", storageBucket: "gestorinmobiliario-d68b3.appspot.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database(); const auth = firebase.auth(); const storage = firebase.storage();
        let choferPerfilData = null;

        window.mostrarNotificacion = function(mensaje) {
            let toast = document.getElementById('toast-notification');
            toast.innerText = mensaje; toast.classList.add('activo');
            setTimeout(() => { toast.classList.remove('activo'); }, 4000);
        }

        window.abrirModalQR = function() { document.getElementById('modal-qr').classList.add('activo'); }
        window.cerrarModalQR = function() { document.getElementById('modal-qr').classList.remove('activo'); }

        window.descargarFlyer = function() {
            const btn = document.getElementById('btn-descargar-flyer');
            btn.innerText = "Generando imagen HD... ⏳";
            const elemento = document.getElementById("flyer-exportable");
            
            html2canvas(elemento, { 
                scale: 2, 
                useCORS: true, 
                backgroundColor: "#0f172a" 
            }).then(canvas => {
                let link = document.createElement('a');
                link.download = 'Mi_Publicidad_TurismoTrips.jpg';
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
                btn.innerText = "📥 Descargar Imagen para Redes";
                mostrarNotificacion("¡Publicidad guardada en tu galería!");
            }).catch(err => {
                console.error(err);
                btn.innerText = "📥 Descargar Imagen para Redes";
                alert("Hubo un problema al generar la imagen. Puedes tomarle una captura de pantalla normal.");
            });
        }

        window.abrirModalPerfil = function() {
            if(!choferPerfilData) return;
            document.getElementById('edit-nombre').value = choferPerfilData.nombre || "";
            document.getElementById('edit-tel').value = choferPerfilData.telefono || "";
            document.getElementById('edit-vehiculo').value = choferPerfilData.vehiculo || "";
            document.getElementById('edit-color').value = choferPerfilData.color || "";
            document.getElementById('edit-chapa').value = choferPerfilData.chapa || "";
            document.getElementById('edit-foto-texto').innerText = "📸 Tocar para elegir nueva foto"; 
            if(choferPerfilData.ciudadBase) document.getElementById('edit-ciudad').value = choferPerfilData.ciudadBase;
            document.getElementById('modal-perfil').classList.add('activo');
        }

        window.cerrarModalPerfil = function() { document.getElementById('modal-perfil').classList.remove('activo'); }
        window.mostrarNombreArchivoEdit = function(inputId, textoId) {
            const file = document.getElementById(inputId).files[0];
            if(file) document.getElementById(textoId).innerText = "✅ " + file.name;
        }

        window.guardarPerfil = async function() {
            const user = auth.currentUser;
            if(!user) return;
            
            const btn = document.getElementById('btn-guardar-perfil');
            btn.innerText = "Guardando... ⏳";
            btn.disabled = true;

            try {
                let fotoUrlGuardada = choferPerfilData.fotoVehiculo || "";
                const archivoNuevo = document.getElementById('edit-foto-archivo').files[0];
                
                if (archivoNuevo) {
                    const storageRef = storage.ref(`autos_choferes/${user.uid}_${archivoNuevo.name}`);
                    const snapshot = await storageRef.put(archivoNuevo);
                    fotoUrlGuardada = await snapshot.ref.getDownloadURL();
                }

                const datosActualizados = {
                    nombre: document.getElementById('edit-nombre').value.trim(),
                    telefono: document.getElementById('edit-tel').value.trim(),
                    vehiculo: document.getElementById('edit-vehiculo').value.trim(),
                    color: document.getElementById('edit-color').value.trim() || "No especificado",
                    chapa: document.getElementById('edit-chapa').value.trim() || "En trámite",
                    fotoVehiculo: fotoUrlGuardada,
                    ciudadBase: document.getElementById('edit-ciudad').value
                };

                await db.ref(`choferes_turismo/${user.uid}`).update(datosActualizados);
                choferPerfilData = { ...choferPerfilData, ...datosActualizados };
                
                document.getElementById('panel-nombre-chofer').innerText = choferPerfilData.nombre;
                actualizarPlacaPublicidad();
                cerrarModalPerfil();
                mostrarNotificacion("¡Perfil actualizado con éxito!");

            } catch (error) {
                alert("Error al guardar: " + error.message);
            } finally {
                btn.innerText = "Guardar";
                btn.disabled = false;
            }
        }

        function actualizarPlacaPublicidad() {
            if(!choferPerfilData) return;
            document.getElementById('promo-nombre').innerText = choferPerfilData.nombre || "Conductor";
            document.getElementById('promo-auto').innerText = `${choferPerfilData.vehiculo || 'Vehículo'} • ${choferPerfilData.color || ''}`;
            document.getElementById('promo-zona').innerText = "Base: " + (choferPerfilData.ciudadBase || "Paraguay");

            let imgElement = document.getElementById('promo-foto-img');
            imgElement.src = choferPerfilData.fotoVehiculo || "https://images.unsplash.com/photo-1549317661-bd32c8ce0db2?auto=format&fit=crop&w=500&q=80";
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref(`choferes_turismo/${user.uid}`).once('value').then(snap => {
                    choferPerfilData = snap.exists() ? snap.val() : { nombre: "Conductor", vehiculo: "Vehículo", color: "Gris", chapa: "Sin Chapa", ciudadBase: "Asunción" };
                    document.getElementById('panel-nombre-chofer').innerText = choferPerfilData.nombre;
                    actualizarPlacaPublicidad();
                    cargarViajesPendientesChofer(user.uid);
                });
            } else { window.location.href = 'login.html'; }
        });

        window.cerrarSesion = function() { auth.signOut().then(() => window.location.href = 'login.html'); }
        window.restaurarDescartados = function() { db.ref(`viajes_turismo/pendientes`).once('value').then(snap => { snap.forEach(c => { db.ref(`viajes_turismo/pendientes/${c.key}/descartados/${auth.currentUser.uid}`).remove(); }); mostrarNotificacion("Bolsa actualizada."); }); }
        
        window.enviarOfertaPrecio = function(viajeId) {
            let precio = document.getElementById(`precio-${viajeId}`).value.trim();
            if(!precio) return alert("Ingrese una tarifa en Guaraníes.");
            db.ref(`viajes_turismo/pendientes/${viajeId}/ofertas/${auth.currentUser.uid}`).set({ 
                choferNombre: choferPerfilData.nombre, 
                choferVehiculo: choferPerfilData.vehiculo,
                choferColor: choferPerfilData.color || "No especificado",
                choferChapa: choferPerfilData.chapa || "Sin Chapa",
                precio: parseInt(precio).toLocaleString('es-PY') + " Gs." 
            });
            mostrarNotificacion("Propuesta enviada.");
        }

        window.descartarViaje = function(viajeId) { db.ref(`viajes_turismo/pendientes/${viajeId}/descartados/${auth.currentUser.uid}`).set(true); }
        window.confirmarAcuerdo = function(viajeId) { if(confirm("¿Confirmar trato con el pasajero?")) db.ref(`viajes_turismo/pendientes/${viajeId}`).update({ estado: 'Acuerdo Cerrado', choferAsignadoUid: auth.currentUser.uid }); }
        window.finalizarViaje = function(viajeId) { if(confirm("¿Marcar este viaje como completado?")) db.ref(`viajes_turismo/pendientes/${viajeId}`).remove(); }

        function cargarViajesPendientesChofer(choferUid) {
            db.ref('viajes_turismo/pendientes').on('value', (snapshot) => {
                let html = '';
                if(snapshot.exists()){
                    let lista = []; snapshot.forEach(c => lista.push({ id: c.key, ...c.val() })); lista.reverse();
                    
                    lista.forEach(v => {
                        try {
                            if (v.descartados && v.descartados[choferUid]) return;
                            let esMio = (v.choferAsignadoUid === choferUid);
                            if (v.choferAsignadoUid && !esMio) return; 

                            let origenTxt = String(v.origen || "N/A").split(' (')[0];
                            let destinoTxt = String(v.destino || "N/A").split(' (')[0];
                            
                            let vNombreChofer = String(choferPerfilData.nombre || 'Chofer');
                            let vVehiculo = String(choferPerfilData.vehiculo || 'Vehículo');
                            let vColor = String(choferPerfilData.color || 'No especificado');
                            let vChapa = String(choferPerfilData.chapa || 'Sin Chapa');
                            let miOferta = (v.ofertas && v.ofertas[choferUid]) ? v.ofertas[choferUid] : null;

                            let textoWpp = `Hola ${v.cliente || 'Pasajero'}, sobre tu viaje de ${origenTxt} a ${destinoTxt} el ${v.fecha || ''}. Soy el chofer *${vNombreChofer}*. \n\n🚗 *Vehículo para tu viaje:* ${vVehiculo}\n🎨 *Color:* ${vColor}\n🔢 *Chapa:* ${vChapa}\n💰 *Tarifa:* ${miOferta ? miOferta.precio : 'a convenir'}. ¿Coordinamos?`;
                            let linkWpp = `https://wa.me/595${String(v.telefono || '').replace(/^0+/, '')}?text=${encodeURIComponent(textoWpp)}`;
                            
                            let linkGmaps = "https://www.google.com/maps";
                            try {
                                let cBase = String(choferPerfilData.ciudadBase || "Asunción").split(' (')[0];
                                linkGmaps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(cBase)}&destination=${encodeURIComponent(destinoTxt)}&waypoints=${encodeURIComponent(origenTxt)}`;
                            } catch(e) {}

                            let btnNormal = !esMio ? `
                                <div class="caja-tarifa">
                                    <input type="number" id="precio-${v.id}" placeholder="Tu Tarifa Propuesta (Gs.)" value="${miOferta ? miOferta.precio.replace(/[^0-9]/g, '') : ''}">
                                    <button class="btn btn-primary" style="width:100%;" onclick="enviarOfertaPrecio('${v.id}')">Enviar Propuesta</button>
                                </div>
                                <div class="grid-2" style="margin-top:10px;">
                                    <button class="btn btn-outline" onclick="descartarViaje('${v.id}')">Ocultar</button>
                                    <button class="btn btn-outline" style="border-color:white;" onclick="confirmarAcuerdo('${v.id}')">Tomar Viaje</button>
                                </div>` : `<button class="btn btn-primary" style="margin-top:15px; width:100%;" onclick="finalizarViaje('${v.id}')">Marcar Viaje como Finalizado</button>`;

                            html += `
                            <div class="viaje-card ${esMio ? 'asignado' : ''}">
                                <h3 style="margin:0 0 10px 0;">De: ${origenTxt}<br>A: ${destinoTxt}</h3>
                                <p style="margin:0 0 5px 0; font-size:0.9rem;">Pasajero: <strong>${v.cliente || 'Pasajero'}</strong> | Pasajeros: <strong>${v.pasajeros || 1}</strong></p>
                                <p style="margin:0 0 15px 0; color:var(--text-muted); font-size:0.85rem;">Fecha: ${v.fecha || 'N/A'}</p>
                                <div class="grid-2">
                                    <button class="btn btn-outline" onclick="window.open('${linkGmaps}')">📍 Mapa</button>
                                    <button class="btn btn-success" onclick="window.open('${linkWpp}')">💬 Chat Pasajero</button>
                                </div>
                                ${btnNormal}
                            </div>`;
                        } catch (error) { console.error("Error en tarjeta:", error); }
                    });
                }
                document.getElementById('contenedor-viajes-chofer').innerHTML = html || "<p style='text-align:center;'>No hay solicitudes en la zona.</p>";
            });
        }
    </script>
</body>
</html>

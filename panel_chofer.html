<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurismoTrips | Panel de Conductor en Vivo</title>
    <style>
        :root { --primary: #0284c7; --bg-base: #0f172a; --bg-card: #1e293b; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #10b981; --warning: #f59e0b; --danger: #ef4444; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-base); color: var(--text-main); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; box-sizing: border-box;}
        
        .container { width: 100%; max-width: 600px; }
        .card { background: var(--bg-card); padding: 30px; border-radius: 12px; border: 1px solid var(--border); box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.3); }
        
        .header-modulo { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
        .header-modulo h3 { margin: 0; font-size: 1.2rem; color: white; }
        .btn-volver { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; font-weight: 600; text-decoration: underline; }
        .btn-volver:hover { color: white; }

        .viaje-card { background: #020617; border: 1px solid var(--border); padding: 18px; border-radius: 10px; margin-bottom: 20px; }
        .viaje-card h4 { margin: 0 0 10px 0; color: white; font-size: 1.1rem; }
        .viaje-card p { margin: 6px 0; font-size: 0.85rem; color: var(--text-muted); }
        .badge-estado { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: rgba(16,185,129,0.2); color: var(--success); }
        .badge-clima { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; background: rgba(245, 158, 11, 0.2); color: var(--warning); }
        
        .btn-opcion { background: var(--primary); border: none; color: white; padding: 10px 15px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-opcion:hover { filter: brightness(1.1); }
        .btn-secundario { background: transparent; color: var(--primary); border: 1px solid var(--primary); font-weight: 600; padding: 10px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 0.85rem; }
        .btn-secundario:hover { background: rgba(2, 132, 199, 0.1); }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

        #toast-notification {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1e293b; color: white; border: 1px solid var(--primary); padding: 14px 24px;
            border-radius: 30px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            opacity: 0; transition: all 0.3s ease-in-out; z-index: 999; pointer-events: none; text-align: center; max-width: 90%;
        }
        #toast-notification.activo { transform: translateX(-50%) translateY(0); opacity: 1; }
    </style>
</head>
<body>

    <div id="toast-notification">Mensaje del sistema</div>

    <div class="container">
        <div class="card">
            <div class="header-modulo">
                <h3 id="panel-nombre-chofer">Centro de Control Chofer</h3>
                <button class="btn-volver" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
            
            <p style="text-align:left; color:white; font-weight:bold; margin-bottom: 5px;">Bolsa de Viajes en Tiempo Real:</p>
            <p id="info-gps-chofer" style="font-size:0.8rem; color:var(--success); margin-bottom: 15px;">🛰️ Activando GPS en vivo...</p>

            <div id="contenedor-viajes-chofer">
                <p style="color:var(--text-muted); font-size:0.9rem;">Cargando solicitudes...</p>
            </div>
        </div>
    </div>

    <!-- FIREBASE COMPAT -->
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s",
            authDomain: "gestorinmobiliario-d68b3.firebaseapp.com",
            projectId: "gestorinmobiliario-d68b3",
            databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com"
        };
        
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database();
        const auth = firebase.auth();

        let choferPerfilData = null;
        let choferLatActual = null;
        let choferLonActual = null;
        const mesesNombre = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];

        window.mostrarNotificacion = function(mensaje) {
            let toast = document.getElementById('toast-notification');
            toast.innerText = mensaje;
            toast.classList.add('activa');
            setTimeout(() => { toast.classList.remove('activa'); }, 4000);
        }

        // Iniciar rastreo GPS en tiempo real del Chofer
        function iniciarRastreoChofer(uid) {
            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(position => {
                    choferLatActual = position.coords.latitude;
                    choferLonActual = position.coords.longitude;
                    
                    // Actualizar posición en tiempo real en Firebase
                    db.ref(`choferes_turismo/${uid}/ubicacionEnVivo`).set({
                        lat: choferLatActual,
                        lon: choferLonActual,
                        ultimaActualizacion: new Date().toLocaleTimeString()
                    });
                    
                    document.getElementById('info-gps-chofer').innerText = `🛰️ GPS Activo (Lat: ${choferLatActual.toFixed(4)}, Lon: ${choferLonActual.toFixed(4)})`;
                }, error => {
                    document.getElementById('info-gps-chofer').innerText = "⚠️ GPS inactivo (Permiso denegado)";
                }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 5000 });
            } else {
                document.getElementById('info-gps-chofer').innerText = "⚠️ Tu navegador no soporta GPS.";
            }
        }

        // Calcular distancia aproximada en kilómetros entre dos coordenadas GPS (Fórmula Haversine)
        function calcularDistanciaKm(lat1, lon1, lat2, lon2) {
            let R = 6371; // Radio de la tierra en km
            let dLat = (lat2 - lat1) * Math.PI / 180;
            let dLon = (lon2 - lon1) * Math.PI / 180;
            let a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                    Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                    Math.sin(dLon/2) * Math.sin(dLon/2);
            let c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return (R * c).toFixed(1);
        }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref(`choferes_turismo/${user.uid}`).once('value').then(snap => {
                    if(snap.exists()) {
                        choferPerfilData = snap.val();
                        document.getElementById('panel-nombre-chofer').innerText = "Panel de " + choferPerfilData.nombre;
                        iniciarRastreoChofer(user.uid);
                        cargarViajesPendientesChofer(user.uid);
                    } else {
                        choferPerfilData = { nombre: "Conductor", vehiculo: "Vehículo Registrado", telefono: "0981000000" };
                        iniciarRastreoChofer(user.uid);
                        cargarViajesPendientesChofer(user.uid);
                    }
                });
            } else {
                window.location.href = 'login.html';
            }
        });

        window.cerrarSesion = function() {
            auth.signOut().then(() => { window.location.href = 'login.html'; });
        }

        function formatearFechaBonita(fechaStr) {
            if(!fechaStr) return "Fecha no especificada";
            let partes = fechaStr.split('-');
            if(partes.length !== 3) return fechaStr;
            let anio = parseInt(partes[0]), mes = parseInt(partes[1]) - 1, dia = parseInt(partes[2]);
            let fechaObj = new Date(anio, mes, dia);
            if(isNaN(fechaObj.getTime())) return fechaStr;
            let nombreDiaLargo = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"][fechaObj.getDay()];
            return `${nombreDiaLargo}, ${dia} de ${mesesNombre[mes]} de ${anio}`;
        }

        window.enviarOfertaPrecio = function(viajeId) {
            let precioInp = document.getElementById(`precio-${viajeId}`).value.trim();
            if(!precioInp || isNaN(precioInp)) { mostrarNotificacion("Ingrese una tarifa válida en Guaraníes."); return; }

            let ofertaData = {
                choferNombre: choferPerfilData.nombre,
                choferVehiculo: choferPerfilData.vehiculo,
                choferTelefono: choferPerfilData.telefono,
                precio: parseInt(precioInp).toLocaleString('es-PY') + " Gs.",
                fechaOferta: new Date().toLocaleTimeString()
            };

            db.ref(`viajes_turismo/pendientes/${viajeId}/ofertas/${auth.currentUser.uid}`).set(ofertaData).then(() => {
                mostrarNotificacion("¡Tarifa guardada correctamente!");
            });
        }

        function cargarViajesPendientesChofer(choferUid) {
            db.ref('viajes_turismo/pendientes').on('value', (snapshot) => {
                let html = '';
                if(snapshot.exists()){
                    let listaViajes = [];
                    snapshot.forEach(child => {
                        let val = child.val();
                        listaViajes.push({ 
                            id: child.key, 
                            fecha: val.fecha || 'Fecha no especificada',
                            pasajeros: val.pasajeros || '1',
                            origen: val.origen || 'Origen no especificado',
                            destino: val.destino || 'Destino no especificado',
                            cliente: val.cliente || 'Pasajero',
                            telefono: val.telefono || '0981000000',
                            clima: val.clima || 'Normal',
                            estado: val.estado || 'Pendiente',
                            lat: val.lat || null,
                            lon: val.lon || null,
                            ofertas: val.ofertas || {}
                        });
                    });

                    listaViajes.reverse();

                    listaViajes.forEach(v => {
                        // Calcular distancia real en vivo si el GPS del chofer y pasajero están activos
                        let distanciaTexto = "Distancia calculándose...";
                        let puntoPartidaGps = v.origen;

                        if (choferLatActual && choferLonActual && v.lat && v.lon) {
                            let km = calcularDistanciaKm(choferLatActual, choferLonActual, v.lat, v.lon);
                            distanciaTexto = `📍 Estás a aprox. <strong>${km} km</strong> del pasajero`;
                            puntoPartidaGps = `${choferLatActual},${choferLonActual}`;
                        }

                        // Mapa GPS inteligente: Chofer (en vivo) -> Pasajero (origen) -> Destino Final
                        let linkGmaps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(puntoPartidaGps)}&destination=${encodeURIComponent(v.destino)}&waypoints=${encodeURIComponent(v.origen)}`;
                        
                        let miOferta = (v.ofertas && v.ofertas[choferUid]) ? v.ofertas[choferUid] : null;
                        let fechaLegible = formatearFechaBonita(v.fecha);

                        let textoWpp = miOferta 
                            ? `Hola ${v.cliente}, vi tu solicitud en TurismoTrips para viajar el ${fechaLegible} a ${v.destino}. Mi propuesta es de *${miOferta.precio}* con vehículo ${choferPerfilData.vehiculo} (${choferPerfilData.nombre} - Tel: ${choferPerfilData.telefono}). ¿Coordinamos?`
                            : `Hola ${v.cliente}, vi tu solicitud en TurismoTrips para viajar el ${fechaLegible} a ${v.destino}. Con vehículo ${choferPerfilData.vehiculo} (${choferPerfilData.nombre}). ¿Conversamos sobre el traslado?`;
                        
                        let linkWppDirecto = `https://wa.me/595${v.telefono.replace(/^0+/, '')}?text=${encodeURIComponent(textoWpp)}`;
                        let alertaClima = (v.clima && v.clima.includes("Tormenta")) ? `background: rgba(239, 68, 68, 0.2); color: var(--danger);` : ``;

                        html += `
                        <div class="viaje-card">
                            <h4>Ruta: ${v.origen} ➔ ${v.destino}</h4>
                            <p>📅 Fecha: <strong>${fechaLegible}</strong> | 👥 Pasajeros: <strong>${v.pasajeros}</strong></p>
                            <p>👤 Pasajero: <strong>${v.cliente}</strong> <span class="badge-estado">${v.estado}</span></p>
                            <p style="color:var(--primary); font-size:0.85rem; margin-top:4px;">${distanciaTexto}</p>
                            <p style="margin-top:6px;"><span class="badge-clima" style="${alertaClima}">Clima: ${v.clima}</span></p>

                            <div style="background:#020617; border:1px dashed var(--border); padding:12px; border-radius:8px; margin-top:12px;">
                                <label style="font-size:0.8rem; color:var(--text-muted); font-weight:bold; display:block; margin-bottom:6px;">TU PROPUESTA DE TARIFA (Gs.):</label>
                                <div style="display:flex; gap:10px;">
                                    <input type="number" id="precio-${v.id}" placeholder="Ej: 250000" value="${miOferta ? miOferta.precio.replace(/[^0-9]/g, '') : ''}" style="padding:10px; width:100%; border-radius:8px; border:1px solid var(--border); background:#0f172a; color:white; outline:none;">
                                    <button class="btn-opcion" style="white-space:nowrap;" onclick="enviarOfertaPrecio('${v.id}')">
                                        ${miOferta ? 'Actualizar' : 'Enviar Tarifa'}
                                    </button>
                                </div>
                                ${miOferta ? `<p style="font-size:0.75rem; color:var(--success); margin:6px 0 0 0;">✔ Oferta guardada: <strong>${miOferta.precio}</strong></p>` : ''}
                            </div>

                            <div class="grid-2" style="margin-top:12px;">
                                <button class="btn-secundario" onclick="window.open('${linkGmaps}', '_blank')">Navegar GPS (En Vivo)</button>
                                <button class="btn-opcion" style="background:#16a34a;" onclick="window.open('${linkWppDirecto}', '_blank')">WhatsApp Pasajero</button>
                            </div>
                        </div>`;
                    });
                } else {
                    html = "<p style='color:white;'>No hay solicitudes activas en este momento.</p>";
                }
                document.getElementById('contenedor-viajes-chofer').innerHTML = html;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TurismoTrips | Panel Conductor</title>
    <style>
        :root { --primary: #0284c7; --bg-base: #0f172a; --bg-card: #1e293b; --bg-input: #334155; --text-main: #f8fafc; --text-muted: #94a3b8; --border: #334155; --success: #16a34a; --danger: #dc2626; }
        body { font-family: -apple-system, sans-serif; background: var(--bg-base); color: var(--text-main); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh;}
        .container { width: 100%; max-width: 600px; }
        
        .header-panel { background: var(--bg-card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .header-acciones { display: flex; gap: 10px; width: 100%; margin-top: 15px; }
        
        .viaje-card { background: var(--bg-card); border: 1px solid var(--border); padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .viaje-card.asignado { border-left: 5px solid var(--success); }
        
        .btn { padding: 12px 15px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; width: 100%; border: none; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; color: var(--text-main); border: 1px solid var(--border); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        
        .caja-tarifa { background: var(--bg-base); padding: 15px; border-radius: 8px; border: 1px solid var(--border); margin-top: 15px; }
        .caja-tarifa input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-input); color: white; margin-bottom: 10px; box-sizing:border-box;}

        /* MODAL DE PUBLICIDAD / FLYER */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; opacity: 0; pointer-events: none; transition: 0.3s; }
        .modal-overlay.activo { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--bg-card); padding: 20px; border-radius: 15px; text-align: center; width: 90%; max-width: 360px; }
        
        .flayer-promo { background: #ffffff; color: #020617; padding: 20px; border-radius: 14px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); overflow: hidden; position: relative; }
        .flayer-promo h3 { margin: 0 0 4px 0; font-size: 1.3rem; color: #0284c7; text-transform: uppercase; font-weight: 900; }
        .flayer-promo .sub-titulo { font-size: 0.8rem; color: #64748b; margin-bottom: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        
        .flayer-foto-auto { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; margin-bottom: 12px; border: 1px solid #e2e8f0; background: #f1f5f9; }
        
        .flayer-promo .auto-info { font-size: 1rem; font-weight: bold; color: #1e293b; margin-bottom: 12px; }
        .flayer-promo .img-qr { width: 160px; height: 160px; margin: 0 auto; display: block; border: 4px solid #0284c7; border-radius: 8px; }
        .flayer-promo .cta-text { margin-top: 12px; font-size: 0.85rem; font-weight: bold; background: #16a34a; color: white; padding: 8px; border-radius: 6px; }
        .flayer-promo .footer-zona { font-size: 0.75rem; color: #475569; margin-top: 8px; font-weight: 600; }
    </style>
</head>
<body>

    <div id="modal-qr" class="modal-overlay">
        <div class="modal-content">
            <h3 style="color:white; margin: 0 0 10px 0;">📢 Tu Placa Publicitaria</h3>
            <p style="color:var(--text-muted); font-size:0.85rem; margin-bottom:15px;">Capturá esta pantalla para publicarla en Facebook o Estados de WhatsApp.</p>
            
            <div class="flayer-promo">
                <h3 id="promo-nombre">Conductor TurismoTrips</h3>
                <div class="sub-titulo">Servicio Privado & Larga Distancia</div>
                
                <img id="promo-foto-img" src="" class="flayer-foto-auto" style="display:none;" alt="Foto Vehículo">
                
                <div class="auto-info" id="promo-auto">Vehículo Confortable</div>
                
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://turismotrips.github.io/TurismoTrips/" alt="QR" class="img-qr">
                
                <div class="cta-text">📲 ESCANEÁ EL QR PARA PEDIR TU VIAJE</div>
                <div class="footer-zona" id="promo-zona">Base de Operaciones: Paraguay</div>
            </div>
            
            <button class="btn btn-outline" style="margin-top: 15px;" onclick="cerrarModalQR()">Cerrar</button>
        </div>
    </div>

    <div class="container">
        <div class="header-panel">
            <h2 id="panel-nombre-chofer" style="margin:0; font-size:1.4rem;">Mi Panel</h2>
            <div class="header-acciones">
                <button class="btn btn-outline" onclick="restaurarDescartados()">🔄 Recargar</button>
                <button class="btn btn-outline" onclick="abrirModalQR()">📢 Mi Publicidad</button>
                <button class="btn btn-outline" style="color:#f87171;" onclick="cerrarSesion()">Salir</button>
            </div>
        </div>
        <div id="contenedor-viajes-chofer"><p style="text-align:center;">Cargando solicitudes...</p></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.4.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyAg6rZnqUFgTcRiAHA0AWvYR-imovVb_0s", authDomain: "gestorinmobiliario-d68b3.firebaseapp.com", projectId: "gestorinmobiliario-d68b3", databaseURL: "https://gestorinmobiliario-d68b3-default-rtdb.firebaseio.com" };
        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const db = firebase.database(); const auth = firebase.auth();
        let choferPerfilData = null;

        window.abrirModalQR = function() { document.getElementById('modal-qr').classList.add('activo'); }
        window.cerrarModalQR = function() { document.getElementById('modal-qr').classList.remove('activo'); }

        auth.onAuthStateChanged(user => {
            if(user) {
                db.ref(`choferes_turismo/${user.uid}`).once('value').then(snap => {
                    choferPerfilData = snap.exists() ? snap.val() : { nombre: "Conductor", vehiculo: "Vehículo", color: "Gris", chapa: "Sin Chapa", ciudadBase: "Asunción" };
                    document.getElementById('panel-nombre-chofer').innerText = choferPerfilData.nombre;
                    
                    // Llenar datos de la placa publicitaria
                    document.getElementById('promo-nombre').innerText = choferPerfilData.nombre;
                    document.getElementById('promo-auto').innerText = `${choferPerfilData.vehiculo} • Color: ${choferPerfilData.color || 'No especificado'}`;
                    document.getElementById('promo-zona').innerText = "Base de Operaciones: " + (choferPerfilData.ciudadBase || "Paraguay");

                    let imgElement = document.getElementById('promo-foto-img');
                    if(choferPerfilData.fotoVehiculo && choferPerfilData.fotoVehiculo.trim() !== "") {
                        imgElement.src = choferPerfilData.fotoVehiculo;
                        imgElement.style.display = "block";
                    } else {
                        imgElement.style.display = "none";
                    }

                    cargarViajesPendientesChofer(user.uid);
                });
            } else { window.location.href = 'login.html'; }
        });

        window.cerrarSesion = function() { auth.signOut().then(() => window.location.href = 'login.html'); }
        window.restaurarDescartados = function() { db.ref(`viajes_turismo/pendientes`).once('value').then(snap => { snap.forEach(c => { db.ref(`viajes_turismo/pendientes/${c.key}/descartados/${auth.currentUser.uid}`).remove(); }); }); }
        
        window.enviarOfertaPrecio = function(viajeId) {
            let precio = document.getElementById(`precio-${viajeId}`).value.trim();
            if(!precio) return alert("Ingrese una tarifa en Guaraníes.");
            db.ref(`viajes_turismo/pendientes/${viajeId}/ofertas/${auth.currentUser.uid}`).set({ 
                choferNombre: choferPerfilData.nombre, 
                choferVehiculo: choferPerfilData.vehiculo,
                choferColor: choferPerfilData.color || "No especificado",
                choferChapa: choferPerfilData.chapa || "Sin Chapa",
                precio: parseInt(precio).toLocaleString('es-PY') + " Gs." 
            });
        }

        window.descartarViaje = function(viajeId) { db.ref(`viajes_turismo/pendientes/${viajeId}/descartados/${auth.currentUser.uid}`).set(true); }
        window.confirmarAcuerdo = function(viajeId) { if(confirm("¿Confirmar trato con el pasajero?")) db.ref(`viajes_turismo/pendientes/${viajeId}`).update({ estado: 'Acuerdo Cerrado', choferAsignadoUid: auth.currentUser.uid }); }
        window.finalizarViaje = function(viajeId) { if(confirm("¿Marcar este viaje como completado?")) db.ref(`viajes_turismo/pendientes/${viajeId}`).remove(); }

        function cargarViajesPendientesChofer(choferUid) {
            db.ref('viajes_turismo/pendientes').on('value', (snapshot) => {
                let html = '';
                if(snapshot.exists()){
                    let lista = []; snapshot.forEach(c => lista.push({ id: c.key, ...c.val() })); lista.reverse();
                    
                    lista.forEach(v => {
                        try {
                            if (v.descartados && v.descartados[choferUid]) return;
                            let esMio = (v.choferAsignadoUid === choferUid);
                            if (v.choferAsignadoUid && !esMio) return; 

                            let origenTxt = String(v.origen || "N/A").split(' (')[0];
                            let destinoTxt = String(v.destino || "N/A").split(' (')[0];
                            
                            let vNombreChofer = String(choferPerfilData.nombre || 'Chofer');
                            let vVehiculo = String(choferPerfilData.vehiculo || 'Vehículo');
                            let vColor = String(choferPerfilData.color || 'No especificado');
                            let vChapa = String(choferPerfilData.chapa || 'Sin Chapa');
                            
                            let miOferta = (v.ofertas && v.ofertas[choferUid]) ? v.ofertas[choferUid] : null;

                            // MENSAJE DE WHATSAPP CON DATOS DE SEGURIDAD (CHAPA + COLOR)
                            let textoWpp = `Hola ${v.cliente || 'Pasajero'}, sobre tu viaje de ${origenTxt} a ${destinoTxt} el ${v.fecha || ''}. Soy el chofer *${vNombreChofer}*. \n\n🚗 *Vehículo para tu viaje:* ${vVehiculo}\n🎨 *Color:* ${vColor}\n🔢 *Chapa:* ${vChapa}\n💰 *Tarifa:* ${miOferta ? miOferta.precio : 'a convenir'}. ¿Coordinamos?`;
                            
                            let linkWpp = `https://wa.me/595${String(v.telefono || '').replace(/^0+/, '')}?text=${encodeURIComponent(textoWpp)}`;
                            
                            let linkGmaps = "https://www.google.com/maps";
                            try {
                                let cBase = String(choferPerfilData.ciudadBase || "Asunción").split(' (')[0];
                                linkGmaps = `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(cBase)}&destination=${encodeURIComponent(destinoTxt)}&waypoints=${encodeURIComponent(origenTxt)}`;
                            } catch(e) {}

                            let btnNormal = !esMio ? `
                                <div class="caja-tarifa">
                                    <input type="number" id="precio-${v.id}" placeholder="Tu Tarifa Propuesta (Gs.)" value="${miOferta ? miOferta.precio.replace(/[^0-9]/g, '') : ''}">
                                    <button class="btn btn-primary" onclick="enviarOfertaPrecio('${v.id}')">Enviar Propuesta</button>
                                </div>
                                <div class="grid-2" style="margin-top:10px;">
                                    <button class="btn btn-outline" onclick="descartarViaje('${v.id}')">Ocultar</button>
                                    <button class="btn btn-outline" style="border-color:white;" onclick="confirmarAcuerdo('${v.id}')">Tomar Viaje</button>
                                </div>` : `<button class="btn btn-primary" style="margin-top:15px;" onclick="finalizarViaje('${v.id}')">Marcar Viaje como Finalizado</button>`;

                            html += `
                            <div class="viaje-card ${esMio ? 'asignado' : ''}">
                                <h3 style="margin:0 0 10px 0;">De: ${origenTxt}<br>A: ${destinoTxt}</h3>
                                <p style="margin:0 0 5px 0; font-size:0.9rem;">Pasajero: <strong>${v.cliente || 'Pasajero'}</strong> | Pasajeros: <strong>${v.pasajeros || 1}</strong></p>
                                <p style="margin:0 0 15px 0; color:var(--text-muted); font-size:0.85rem;">Fecha: ${v.fecha || 'N/A'}</p>
                                <div class="grid-2">
                                    <button class="btn btn-outline" onclick="window.open('${linkGmaps}')">📍 Mapa</button>
                                    <button class="btn btn-success" onclick="window.open('${linkWpp}')">💬 Chat Pasajero</button>
                                </div>
                                ${btnNormal}
                            </div>`;
                        } catch (error) { console.error("Error en tarjeta:", error); }
                    });
                }
                document.getElementById('contenedor-viajes-chofer').innerHTML = html || "<p style='text-align:center;'>No hay solicitudes en la zona.</p>";
            });
        }
    </script>
</body>
</html>
